name: Refresh SST anomaly

on:
  schedule:
    # 13:00 UTC daily, after NOAA's daily OISST v2 High-Res update lands.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # allow manual runs (first run / testing)

# Let the job push the refreshed JSON back to the repo.
permissions:
  contents: write

# Never let two refreshes run at once (e.g. a manual run during the schedule).
concurrency:
  group: refresh-sst
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # No scipy: the highres climatology shares the daily field's 0.25 deg grid,
        # so extract_sst_anomaly.py subtracts directly instead of interpolating.
        # rasterio is for the per-country drought layers: it reads the NIDIS
        # Cloud-Optimized GeoTIFFs and rasterises country polygons for the
        # zonal means.
        run: pip install xarray netCDF4 pandas numpy requests pillow rasterio

      # The 1991-2020 climatology (~350MB at 0.25 deg) never changes, so cache it
      # across runs instead of re-downloading from NOAA every day. Runners are
      # ephemeral, so without this the file would be fetched on every single run.
      # Key is versioned: it changed when we moved off the 1-degree baseline, and
      # must change again if the cached file ever does.
      - name: Cache 1991-2020 climatology
        uses: actions/cache@v5
        with:
          path: sst.day.mean.ltm.1991-2020.nc
          key: oisst-climatology-highres-1991-2020-v2

      - name: Extract latest SST anomaly
        run: python extract_sst_anomaly.py --out sst_anomaly.png --archive

      # Independent of the SST extraction above: different sources, different
      # cadences (SPI/SPEI daily, vegetation health weekly). A failure here must
      # not cost the SST refresh, and the script already degrades layer by layer,
      # so the step is allowed to fail without failing the job.
      - name: Extract per-country drought layers
        continue-on-error: true
        run: python extract_drought_layers.py --out drought_country.json

      - name: Commit refreshed data if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only a real change should commit. The PNG holds the whole grid, so a
          # byte compare settles it (the encoder is deterministic for identical
          # input); the sidecar is compared separately with generated_at stripped,
          # since that timestamp changes on every run. A NOAA revision to the same
          # date's grid still counts as a change, via the PNG.
          #
          # The comparison runs through python rather than jq deliberately. With
          # jq, a missing or erroring jq makes both sides of the diff empty, they
          # compare equal, and a real change is silently skipped -- the failure
          # mode points the wrong way. python is already installed above, and an
          # error from it is a non-zero exit, which reads as "changed".
          png_same=false; meta_same=false
          if git cat-file -e HEAD:sst_anomaly.png 2>/dev/null \
             && git show HEAD:sst_anomaly.png | cmp -s - sst_anomaly.png; then
            png_same=true
          fi
          # (kept on one line: inside this block scalar an indented heredoc would
          # reach python with leading whitespace and fail to parse)
          if git show HEAD:sst_anomaly.meta.json > prev.meta.json 2>/dev/null \
             && python -c "import json,sys; s=lambda p:{k:v for k,v in json.load(open(p)).items() if k!='generated_at'}; sys.exit(0 if s('prev.meta.json')==s('sst_anomaly.meta.json') else 1)"; then
            meta_same=true
          fi
          rm -f prev.meta.json

          # The archive is judged by the same verdict rather than on its own:
          # re-running on an unchanged day still rewrites its manifest timestamps,
          # so diffing it directly would commit every single day for no reason.
          # The drought layers are judged separately from the SST data: they come
          # from other sources on other cadences, so either can change on a day
          # the other does not. Same generated_at-stripped comparison as above.
          drought_same=false
          if [ -f drought_country.json ]; then
            if git show HEAD:drought_country.json > prev.drought.json 2>/dev/null \
               && python -c "import json,sys; s=lambda p:{k:v for k,v in json.load(open(p)).items() if k!='generated_at'}; sys.exit(0 if s('prev.drought.json')==s('drought_country.json') else 1)"; then
              drought_same=true
            fi
            # The overlay grids are judged on their PNGs alone. Their sidecars
            # carry a generated_at that moves every run, whereas the encoder is
            # deterministic, so the image is the honest signal for whether the
            # underlying product actually changed. The layers refresh on quite
            # different cadences -- 90-day SPI daily, 270-day SPI every few
            # weeks, vegetation health weekly -- so most days only some move.
            for png in layers/*.png; do
              [ -f "$png" ] || continue
              if ! { git cat-file -e "HEAD:$png" 2>/dev/null \
                     && git show "HEAD:$png" | cmp -s - "$png"; }; then
                drought_same=false
                echo "changed: $png"
              fi
            done
          else
            drought_same=true    # the step failed or was skipped; nothing to add
          fi
          rm -f prev.drought.json

          paths=""
          if $png_same && $meta_same; then
            echo "SST data unchanged (only generated_at differs)."
            git checkout -- archive 2>/dev/null || true   # drop the timestamp churn
            git clean -fd archive 2>/dev/null || true
          else
            paths="$paths sst_anomaly.png sst_anomaly.meta.json archive"
          fi

          if $drought_same; then
            echo "Drought layers unchanged."
            git checkout -- drought_country.json layers 2>/dev/null || true
            git clean -fd layers 2>/dev/null || true
          else
            paths="$paths drought_country.json layers"
          fi

          if [ -z "$paths" ]; then
            echo "Nothing to commit."
          else
            git add $paths
            git commit -m "Refresh climate data ($(date -u +%Y-%m-%d))"
            git push
          fi
