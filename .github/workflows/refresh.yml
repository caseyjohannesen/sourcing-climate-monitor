name: Refresh SST anomaly

on:
  schedule:
    # 13:00 UTC daily, after NOAA's daily OISST v2 High-Res update lands.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # allow manual runs (first run / testing)

# Let the job push the refreshed JSON back to the repo.
permissions:
  contents: write

# Never let two refreshes run at once (e.g. a manual run during the schedule).
concurrency:
  group: refresh-sst
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # scipy is required by xarray's .interp() call in extract_sst_anomaly.py
        # (it's pulled in implicitly in many local envs, but not on a clean runner).
        run: pip install xarray netCDF4 pandas numpy requests scipy

      # The 1991-2020 climatology (~90MB) never changes, so cache it across runs
      # instead of re-downloading from NOAA every day. Runners are ephemeral, so
      # without this the file would be fetched on every single run.
      - name: Cache 1991-2020 climatology
        uses: actions/cache@v5
        with:
          path: sst.day.ltm.1991-2020.nc
          key: oisst-climatology-1991-2020-v1

      - name: Extract latest SST anomaly
        run: python extract_sst_anomaly.py --out sst_anomaly.json

      - name: Commit refreshed data if the SST data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Decide whether to commit by comparing against the committed JSON while
          # ignoring the volatile generated_at timestamp (which changes every run).
          # Only a real change to the date or the anomaly grid should commit; a
          # NOAA revision to the same date's grid still counts as a change.
          if git cat-file -e HEAD:sst_anomaly.json 2>/dev/null \
             && diff -q \
                  <(git show HEAD:sst_anomaly.json | jq -S 'del(.generated_at)') \
                  <(jq -S 'del(.generated_at)' sst_anomaly.json) >/dev/null; then
            echo "SST data unchanged (only generated_at differs); nothing to commit."
          else
            git add sst_anomaly.json
            git commit -m "Refresh SST anomaly ($(date -u +%Y-%m-%d))"
            git push
          fi
